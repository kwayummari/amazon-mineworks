services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?set DB_ROOT_PASS in .env}
      MYSQL_DATABASE: ${DB_NAME:?set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal

  php:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:?set DB_NAME in .env}
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASS: ${DB_PASS:?set DB_PASS in .env}
    volumes:
      - ./backend:/var/www/html/backend:ro
    networks:
      - internal
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./build:/var/www/html/build:ro
      - ./backend:/var/www/html/backend:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks:
      - web
      - internal
    depends_on:
      - php

networks:
  web:
    external: true
  internal:
    driver: bridge

volumes:
  db_data:
